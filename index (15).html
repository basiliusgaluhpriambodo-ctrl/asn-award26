<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASN AWARD</title>
<style>
  :root{
    --navy:#132A46;
    --navy-2:#1D3A5F;
    --gold:#C69A3C;
    --gold-dark:#a97f2b;
    --paper:#F6F4EF;
    --ink:#1B1B1B;
    --line:#DCD6C8;
    --green:#3F6B4E;
    --red:#8C3A34;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  .medal{
    display:inline-flex;align-items:center;justify-content:center;
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(155deg,var(--gold),var(--gold-dark));
    color:var(--navy);font-weight:700;font-size:15px;flex-shrink:0;
  }
  /* ---------- Login (split screen) ---------- */
  #login-screen{
    min-height:100vh;display:flex;background:#fff;
  }
  .login-left{
    width:44%;min-width:320px;background:var(--navy);
    display:flex;align-items:center;padding:60px 5%;overflow:hidden;
  }
  .login-brand{display:flex;align-items:center;gap:22px;flex-wrap:wrap;max-width:100%;}
  .login-brand .badge-svg{flex-shrink:0;}
  .brand-text{min-width:0;flex:1 1 200px;}
  .brand-text h1{
    font-family:Georgia,'Times New Roman',serif;color:var(--gold);
    font-size:clamp(22px,3.4vw,34px);letter-spacing:1.5px;margin:0 0 8px;font-weight:700;
    text-shadow:0 1px 0 rgba(0,0,0,.2);overflow-wrap:break-word;white-space:normal;
  }
  .brand-text p{color:#fff;font-size:clamp(11px,1.4vw,16px);letter-spacing:3px;margin:0;font-weight:300;overflow-wrap:break-word;white-space:normal;}
  .login-right{
    flex:1;display:flex;flex-direction:column;justify-content:center;
    padding:60px 8% 60px 6%;max-width:640px;
  }
  .org-logo{display:flex;align-items:flex-end;gap:10px;margin-bottom:34px;}
  .org-logo .ol-word{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:44px;color:var(--navy);letter-spacing:1px;}
  .org-logo .ol-hex{width:74px;height:74px;flex-shrink:0;}
  .org-logo .ol-sub{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:#8a8a8a;font-style:italic;margin-left:2px;}
  .login-right h2{font-size:16px;color:#222;font-weight:700;margin:0 0 18px;}
  .role-btn{
    display:block;width:100%;max-width:500px;text-align:center;
    background:var(--navy-2);color:#fff;padding:14px 20px;margin-bottom:16px;
    border-radius:8px;cursor:pointer;font-family:Georgia,'Times New Roman',serif;
    font-size:16px;letter-spacing:.3px;border:2px solid transparent;user-select:none;
    transition:background .15s, border-color .15s;
  }
  .role-btn:hover{background:#2C5286;}
  .role-btn.active{background:#2C5286;border-color:var(--gold);}
  .login-fields{max-width:500px;margin-top:6px;margin-bottom:6px;display:none;}
  .login-fields.show{display:block;}
  .btn-login{
    display:block;margin:26px auto 0;background:var(--gold);color:var(--navy);
    border:none;padding:13px 46px;border-radius:24px;font-weight:700;font-size:13px;
    letter-spacing:1px;cursor:pointer;box-shadow:0 8px 18px rgba(198,154,60,.35);
  }
  .btn-login:hover{background:var(--gold-dark);}
  label{display:block;font-size:12.5px;color:#555;margin:12px 0 4px;}
  input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;
    font-size:13.5px;background:#FBFAF7;color:var(--ink);
  }
  textarea{resize:vertical;min-height:56px;font-family:inherit;}
  .btn{
    display:inline-block;border:none;border-radius:4px;padding:9px 16px;font-size:13.5px;
    cursor:pointer;font-weight:600;letter-spacing:.2px;
  }
  .btn-primary{background:var(--gold);color:var(--navy);}
  .btn-primary:hover{background:var(--gold-dark);}
  .btn-outline{background:transparent;border:1px solid var(--navy);color:var(--navy);}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-red{background:var(--red);color:#fff;}
  .btn-sm{padding:5px 10px;font-size:12px;}
  .btn-block{width:100%;margin-top:18px;}
  .err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:14px;max-width:500px;}
  .hint{margin-top:16px;font-size:11.5px;color:#999;line-height:1.5;}

  /* ---------- App shell ---------- */
  #app-screen{display:none;min-height:100vh;}
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:230px;background:var(--navy);color:#fff;flex-shrink:0;
    display:flex;flex-direction:column;padding:20px 0;
  }
  .sb-brand{padding:0 20px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;}
  .sb-brand h2{font-size:16px;margin:0 0 2px;letter-spacing:.3px;}
  .sb-brand span{font-size:11px;color:#B9C3D0;}
  .sb-user{padding:12px 20px;font-size:12px;color:#CBD4DE;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;}
  .sb-user b{display:block;color:#fff;font-size:13px;margin-bottom:2px;}
  .nav-item{
    padding:11px 20px;font-size:13.5px;cursor:pointer;color:#C9D2DC;
    border-left:3px solid transparent;
  }
  .nav-item:hover{background:rgba(255,255,255,.05);}
  .nav-item.active{background:rgba(255,255,255,.08);color:#fff;border-left-color:var(--gold);font-weight:600;}
  .nav-sub{padding-left:36px;font-size:12.5px;}
  .sb-logout{margin-top:auto;padding:14px 20px;font-size:12.5px;color:#E7BEBE;cursor:pointer;border-top:1px solid rgba(255,255,255,.12);}
  .main{flex:1;padding:28px 34px;overflow-x:auto;}
  .page-title{font-size:20px;margin:0 0 4px;color:var(--navy);}
  .page-sub{font-size:13px;color:#777;margin:0 0 22px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:20px;}
  .card h3{margin:0 0 14px;font-size:15px;color:var(--navy);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;background:#EFEBE1;color:#4a4536;padding:8px 10px;font-size:11.5px;
    letter-spacing:.3px;border-bottom:1px solid var(--line);white-space:nowrap;
  }
  td{padding:8px 10px;border-bottom:1px solid #EEE9DC;vertical-align:top;}
  tr:hover td{background:#FBFAF5;}
  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill-wait{background:#EFE6CC;color:#8a6d1f;}
  .pill-go{background:#DCEBE0;color:var(--green);}
  .pill-stop{background:#F2DEDC;color:var(--red);}
  .pill-done{background:#DDE6F0;color:var(--navy);}
  .filter-row{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
  .filter-row select{width:auto;min-width:260px;}
  .empty{padding:26px;text-align:center;color:#999;font-size:13px;}
  .tag{font-size:11px;background:#EFEBE1;padding:2px 7px;border-radius:4px;color:#665;}
  .subtabs{display:flex;gap:4px;margin-bottom:18px;border-bottom:1px solid var(--line);}
  .subtab{padding:9px 16px;font-size:13px;cursor:pointer;color:#666;border-bottom:2px solid transparent;}
  .subtab.active{color:var(--navy);border-bottom-color:var(--gold);font-weight:600;}

  /* modal */
  .modal-bg{
    display:none;position:fixed;inset:0;background:rgba(10,15,25,.55);
    align-items:flex-start;justify-content:center;z-index:50;padding:36px 16px;overflow-y:auto;
  }
  .modal-bg.show{display:flex;}
  .modal{
    background:#fff;border-radius:6px;max-width:760px;width:100%;padding:26px 28px 30px;
    max-height:90vh;overflow-y:auto;
  }
  .modal-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;}
  .modal-head h3{margin:0;font-size:16px;color:var(--navy);}
  .modal-close{cursor:pointer;font-size:20px;color:#999;line-height:1;}
  .score-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
  .info-block{background:#FAF8F2;border:1px solid var(--line);border-radius:5px;padding:14px 16px;margin-bottom:16px;font-size:12.5px;line-height:1.7;}
  .info-block b{color:var(--navy);}
  .score-final{
    margin-top:16px;padding:12px 14px;background:#132A46;color:#fff;border-radius:5px;
    display:flex;justify-content:space-between;align-items:center;font-size:14px;
  }
  .score-final b{color:var(--gold);font-size:18px;}
  .toast{
    position:fixed;bottom:22px;right:22px;background:var(--navy);color:#fff;padding:11px 18px;
    border-radius:5px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:100;display:none;
  }
  @media(max-width:820px){
    .shell{flex-direction:column;}
    .sidebar{width:100%;flex-direction:row;overflow-x:auto;padding:10px;}
    .sb-brand,.sb-user,.sb-logout{display:none;}
    .nav-item{white-space:nowrap;border-left:none;border-bottom:3px solid transparent;}
    .nav-item.active{border-left:none;border-bottom-color:var(--gold);}
    .main{padding:18px;}
    .grid2,.score-grid{grid-template-columns:1fr;}
  }
</style>
</head>

/* ============================================================
   Excel — Export & Import
   ============================================================ */
function exportExcel(filename, sheetName, rows){
  if(!window.XLSX){ toast("Pustaka Excel gagal dimuat. Periksa koneksi internet."); return; }
  if(!rows || !rows.length){ toast("Tidak ada data untuk diekspor."); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, sheetName.slice(0,31));
  XLSX.writeFile(wb, filename);
}
function importExcel(fileInput, onRows){
  const file = fileInput.files && fileInput.files[0];
  if(!file) return;
  if(!window.XLSX){ toast("Pustaka Excel gagal dimuat. Periksa koneksi internet."); return; }
  const reader = new FileReader();
  reader.onload = (e)=>{
    try{
      const wb = XLSX.read(e.target.result, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {defval:""});
      onRows(rows);
    }catch(err){
      console.error(err); toast("Gagal membaca file Excel. Pastikan formatnya benar.");
    }
    fileInput.value = "";
  };
  reader.readAsArrayBuffer(file);
}

}
let __saveQueue = Promise.resolve();
function saveDB(){
  if(!GAS_READY){ toast("Database belum dikonfigurasi. Lihat PANDUAN_APPS_SCRIPT.md"); return Promise.resolve(); }
  const payload = JSON.stringify({action:"save", data:DB});
  __saveQueue = __saveQueue.then(async ()=>{
    try{
      const res = await fetch(GAS_URL, { method:"POST", body: payload });
      const json = await res.json();
      if(!json.ok){ console.error(json); toast("Gagal menyimpan data ke server."); }
    }catch(e){ console.error(e); toast("Gagal menyimpan data ke server."); }
  });
  return __saveQueue;
}

/* ============================================================
   Perhitungan nilai
   ============================================================ */
function kompetenScore(p, sertifikatAda, suratAda){
  const skp = p ? num(p.skp) : 0;
  const sert = sertifikatAda ? 100 : 80;
  const surat = suratAda ? 100 : 80;
  return ((skp + sert + surat)/3) * 0.10;
}
function finalAdministrasi(s, p, reg){
  const kompeten = kompetenScore(p, reg.sertifikatAda, reg.suratTugasAda);
  return r1(num(s.berorientasi)*0.10 + num(s.akuntabel)*0.10 + kompeten +
    num(s.harmonis)*0.10 + num(s.loyal)*0.10 + num(s.adaptif)*0.40 + num(s.kolaboratif)*0.10);
}
function finalKunjungan(s, p, reg){
  const kompeten = kompetenScore(p, reg.sertifikatAda, reg.suratTugasAda);
  return r1(num(s.berorientasi)*0.10 + num(s.akuntabel)*0.10 + kompeten +
    num(s.harmonis)*0.10 + num(s.loyal)*0.10 + num(s.adaptif)*0.30 + num(s.kolaboratif)*0.10 + num(s.durasi)*0.10);
}
function finalWawancara(s){
  return r1((num(s.kebaruan)+num(s.efektivitas)+num(s.bermanfaatan)+num(s.replikatif)+num(s.berkelanjutan))/5);
}
function avgOf(obj, finalFn, p, reg){
  const vals = Object.values(obj||{});
  if(!vals.length) return null;
  const scores = vals.map(s=>finalFn(s,p,reg));
  return r1(scores.reduce((a,b)=>a+b,0)/scores.length);
}
function getParticipant(nip){ return DB.participants.find(x=>x.nip===nip); }
function regsByKategori(kat, extraFilter){
  return DB.registrations.filter(r=>r.kategori===kat && (!extraFilter || extraFilter(r)));
}
function rankList(list, valueFn){
  const withVal = list.filter(r=>valueFn(r)!==null);
  withVal.sort((a,b)=>valueFn(b)-valueFn(a));
  const rankMap={};
  withVal.forEach((r,i)=>rankMap[r.id]=i+1);
  return rankMap;
}

function plenoStoreKeys(tahap){
  return {
    storeKey: tahap==='administrasi'?'penilaianAdministrasi':tahap==='kunjungan'?'penilaianKunjungan':'penilaianWawancara',
    plenoKey: tahap==='administrasi'?'plenoAdministrasi':tahap==='kunjungan'?'plenoKunjungan':'plenoWawancara',
    finalFn: tahap==='administrasi'?finalAdministrasi:tahap==='kunjungan'?finalKunjungan:finalWawancara
  };
}
function plenoListFor(tahap){
  if(tahap==='administrasi') return DB.registrations.slice();
  if(tahap==='kunjungan') return DB.registrations.filter(r=>r.plenoAdministrasi && r.plenoAdministrasi.keputusan==='lanjut');
  return DB.registrations.filter(r=>r.plenoKunjungan && r.plenoKunjungan.keputusan==='lanjut');
}
function exportPleno(tahap){
  const {storeKey, plenoKey, finalFn} = plenoStoreKeys(tahap);
  const list = plenoListFor(tahap);
  const rankMap = {};
  KATEGORI.forEach(k=>{
    const inKat = list.filter(r=>r.kategori===k);
    Object.assign(rankMap, rankList(inKat, r=> r[plenoKey] ? r[plenoKey].nilai : avgOf(r[storeKey], finalFn, tahap==='wawancara'?null:getParticipant(r.nip), r)));
  });
  const rows = list.map(r=>{
    const p=getParticipant(r.nip);
    const panelisAvg = avgOf(r[storeKey], finalFn, tahap==='wawancara'?null:p, r);
    const pleno = r[plenoKey];
    return {
      NIP:r.nip, Nama:p?p.nama:'', "Unit Kerja":p?p.unitKerja:'', "Perangkat Daerah":p?p.perangkatDaerah:'',
      Kategori:r.kategori,
      "Nilai Panelis": panelisAvg===null?'':panelisAvg,
      Rangking: panelisAvg===null?'':(rankMap[r.id]||''),
      "Nilai Pleno": pleno?pleno.nilai:'',
      Keputusan: tahap==='wawancara' ? '' : (pleno?(pleno.keputusan==='lanjut'?'Lanjut':'Tidak Lanjut'):'')
    };
  });
  exportExcel(`rekap_pleno_${tahap}.xlsx`, TAHAP_LABEL[tahap], rows);
}
function importPleno(tahap, input){
  importExcel(input, (rows)=>{
    const {plenoKey} = plenoStoreKeys(tahap);
    let updated=0, skipped=0;
    rows.forEach(row=>{
      const nip=String(row.NIP||row.nip||"").trim();
      const nilaiRaw = row["Nilai Pleno"]!==undefined ? row["Nilai Pleno"] : row.nilai_pleno;
      if(!nip || nilaiRaw===undefined || nilaiRaw===""){ skipped++; return; }
      const nilai = Number(nilaiRaw);
      if(isNaN(nilai)){ skipped++; return; }
      const reg = DB.registrations.find(r=>r.nip===nip);
      if(!reg){ skipped++; return; }
      const entry = { raw: (reg[plenoKey] && reg[plenoKey].raw) || {}, nilai };
      if(tahap!=='wawancara'){
        let kep = String(row.Keputusan||row.keputusan||"").trim().toLowerCase();
        if(kep.startsWith('lanjut')) kep='lanjut';
        else if(kep.startsWith('tidak')) kep='tidak';
        else kep = (reg[plenoKey] && reg[plenoKey].keputusan) || '';
        if(!kep){ skipped++; return; }
        entry.keputusan = kep;
      }
      reg[plenoKey] = entry;
      updated++;
    });
    saveDB(); toast(`Impor pleno selesai: ${updated} diperbarui${skipped?`, ${skipped} baris dilewati`:''}.`);
    renderApp();
  });
}

  else if(tahap==='kunjungan'){ panelisObj=r.penilaianKunjungan; finalFn=finalKunjungan; existingPleno=r.plenoKunjungan; }
  else { panelisObj=r.penilaianWawancara; finalFn=finalWawancara; existingPleno=r.plenoWawancara; }
  const panelisAvg = tahap==='wawancara' ? avgOf(panelisObj, finalWawancara, null, r) : avgOf(panelisObj, finalFn, p, r);

function labelFor(f){
  const map={berorientasi:"Berorientasi Pelayanan",akuntabel:"Akuntabel",harmonis:"Harmonis",loyal:"Loyal",
    adaptif:"Adaptif",kolaboratif:"Kolaboratif",durasi:"Durasi Inovasi",
    kebaruan:"Kebaruan",efektivitas:"Efektivitas",bermanfaatan:"Bermanfaatan",replikatif:"Replikatif",berkelanjutan:"Berkelanjutan"};
  return map[f]||f;
}
function savePleno(regId, tahap){
  const r = DB.registrations.find(x=>x.id===regId);
  const p = getParticipant(r.nip);
  let fields;
  if(tahap==='administrasi') fields=["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif"];
  else if(tahap==='kunjungan') fields=["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif","durasi"];
  else fields=["kebaruan","efektivitas","bermanfaatan","replikatif","berkelanjutan"];
  const raw={};
  fields.forEach(f=>raw[f]=num(val('pl-'+f)));
  let nilai;
  if(tahap==='administrasi') nilai=finalAdministrasi(raw,p,r);
  else if(tahap==='kunjungan') nilai=finalKunjungan(raw,p,r);
  else nilai=finalWawancara(raw);
  const entry = {raw, nilai};
  if(tahap!=='wawancara'){
    const kep = val('pl-keputusan');
    if(!kep){ toast("Pilih keputusan terlebih dahulu."); return; }
    entry.keputusan = kep;
  }
  if(tahap==='administrasi') r.plenoAdministrasi = entry;
  else if(tahap==='kunjungan') r.plenoKunjungan = entry;
  else r.plenoWawancara = entry;
  saveDB(); closeModal(); toast("Nilai pleno disimpan."); renderApp();
}

function closeModal(){ document.getElementById('modal-bg').classList.remove('show'); }

    hasil: val('rf-hasil'), ruangLingkup: val('rf-ruang'), linkEvidence: val('rf-link'),
    suratTugasAda: val('rf-surat')==='1', sertifikatAda: val('rf-sert')==='1',
    penilaianAdministrasi:{}, penilaianKunjungan:{}, penilaianWawancara:{},
    plenoAdministrasi:null, plenoKunjungan:null, plenoWawancara:null
  };
  DB.registrations.push(reg);
  saveDB(); toast("Pendaftaran inovasi berhasil dikirim."); renderPeserta();
}
function renderPemantauan(){
  const m=document.getElementById('main');
  const reg = myRegistration();
  if(!reg){
    m.innerHTML = `<h1 class="page-title">Pemantauan</h1><div class="card"><div class="empty">Anda belum mendaftarkan inovasi. Buka menu Pendaftaran Inovasi terlebih dahulu.</div></div>`;
    return;
  }
  const stage = (title, pleno, panelisAvg) => `
    <div class="card">
      <h3>${title}</h3>
      ${!panelisAvg && !pleno ? `<div class="empty">Belum memasuki tahap ini.</div>` : `
        <p style="font-size:13px;margin:4px 0">Nilai Panelis: <b>${panelisAvg===null?'Belum dinilai':panelisAvg}</b></p>
        ${pleno ? `<p style="font-size:13px;margin:4px 0">Nilai Pleno: <b>${pleno.nilai}</b></p>
        ${pleno.keputusan? `<p style="margin:8px 0 0">${pillFor(pleno.keputusan)}</p>` : ''}` : `<p class="hint">Menunggu hasil rapat pleno.</p>`}
      `}
    </div>`;
  const p = getParticipant(reg.nip);
  const admAvg = avgOf(reg.penilaianAdministrasi, finalAdministrasi, p, reg);
  const kunAvg = reg.plenoAdministrasi && reg.plenoAdministrasi.keputusan==='lanjut' ? avgOf(reg.penilaianKunjungan, finalKunjungan, p, reg) : null;
  const wawAvg = reg.plenoKunjungan && reg.plenoKunjungan.keputusan==='lanjut' ? avgOf(reg.penilaianWawancara, finalWawancara, null, reg) : null;
  m.innerHTML = `
    <h1 class="page-title">Pemantauan Status Seleksi</h1>
    <p class="page-sub">${esc(reg.judul)} — ${esc(reg.kategori)}</p>
    ${stage("Seleksi Administrasi", reg.plenoAdministrasi, admAvg)}
    ${reg.plenoAdministrasi ? (reg.plenoAdministrasi.keputusan==='lanjut' ? stage("Kunjungan Lapangan", reg.plenoKunjungan, kunAvg) : `<div class="card"><h3>Kunjungan Lapangan</h3><div class="empty">Tidak lanjut ke tahap ini berdasarkan hasil rapat pleno.</div></div>`) : ''}
    ${reg.plenoKunjungan && reg.plenoKunjungan.keputusan==='lanjut' ? stage("Wawancara", reg.plenoWawancara, wawAvg) : (reg.plenoKunjungan ? `<div class="card"><h3>Wawancara</h3><div class="empty">Tidak lanjut ke tahap ini berdasarkan hasil rapat pleno.</div></div>` : '')}
    ${reg.plenoWawancara ? `<div class="card"><h3>Hasil Akhir ASN AWARD</h3><p style="font-size:13px">Nilai wawancara final: <b>${reg.plenoWawancara.nilai}</b>. Rangking akhir ditetapkan melalui rapat pleno wawancara dan akan diumumkan oleh panitia.</p></div>` : ''}
  `;
}

/* ============================================================
   PANELIS
   ============================================================ */
function renderPanelis(){
  const tahap = SESSION.data.tahap;
  if(tahap==='administrasi') renderPanelisAdministrasi();
  else if(tahap==='kunjungan') renderPanelisKunjungan();
  else renderPanelisWawancara();
}
function panelisKategoriPicker(){
  return `<div class="filter-row">
    <select id="pk-kat" onchange="UI.panelisKategori=this.value;renderApp();">
      <option value="">— Pilih Kategori Penilaian —</option>
      ${KATEGORI.map(k=>`<option value="${esc(k)}" ${UI.panelisKategori===k?'selected':''}>${esc(k)}</option>`).join("")}
    </select>
  </div>`;
}
function renderPanelisAdministrasi(){
  const m=document.getElementById('main');
  const myNip = SESSION.data.nip;
  let rows="";
  if(UI.panelisKategori){
    const list = regsByKategori(UI.panelisKategori);
    rows = list.map(r=>{
      const p=getParticipant(r.nip);
      const mine = r.penilaianAdministrasi[myNip];
      const avg = avgOf(r.penilaianAdministrasi, finalAdministrasi, p, r);
      return `<tr>
        <td>${esc(r.nip)}</td><td>${esc(p?p.nama:'-')}</td><td>${esc(p?p.unitKerja:'-')}</td><td>${esc(p?p.perangkatDaerah:'-')}</td>
        <td>${mine?mine.final:'<span class="tag">Belum</span>'}</td>
        <td>${avg===null?'-':avg}</td>
        <td><button class="btn btn-navy btn-sm" onclick="openScoreModal('${r.id}','administrasi')">${mine?'Ubah Nilai':'Beri Penilaian'}</button></td>
      </tr>`;
    }).join("");
  }
  m.innerHTML = `
    <h1 class="page-title">Seleksi Administrasi</h1>
    <p class="page-sub">Pilih kategori untuk menilai peserta yang telah mendaftar.</p>
    <div class="card">
      <h3>Instrumen Penilaian</h3>
      <p style="font-size:13px">${esc(DB.instruments.administrasi)||'Belum ada instrumen diunggah admin.'}</p>
    </div>
    <div class="card">
      ${panelisKategoriPicker()}
      ${!UI.panelisKategori ? `<div class="empty">Pilih kategori penilaian di atas.</div>` :
        (rows ? `<table><thead><tr><th>NIP</th><th>Nama</th><th>Unit Kerja</th><th>Perangkat Daerah</th><th>Nilai Administrasi</th><th>Hasil Penilaian</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty">Belum ada peserta pada kategori ini.</div>`)}
    </div>
  `;
}
function renderPanelisKunjungan(){
  const m=document.getElementById('main');
  const myNip = SESSION.data.nip;
  let rows="";
  if(UI.panelisKategori){
    const list = regsByKategori(UI.panelisKategori, r=>r.plenoAdministrasi && r.plenoAdministrasi.keputusan==='lanjut');
    rows = list.map(r=>{
      const p=getParticipant(r.nip);
      const mine = r.penilaianKunjungan[myNip];
      const avg = avgOf(r.penilaianKunjungan, finalKunjungan, p, r);
      return `<tr>
        <td>${esc(r.nip)}</td><td>${esc(p?p.nama:'-')}</td><td>${esc(p?p.unitKerja:'-')}</td><td>${esc(p?p.perangkatDaerah:'-')}</td>
        <td>${mine?mine.final:'<span class="tag">Belum</span>'}</td>
        <td>${avg===null?'-':avg}</td>
        <td><button class="btn btn-navy btn-sm" onclick="openScoreModal('${r.id}','kunjungan')">${mine?'Ubah Nilai':'Beri Penilaian'}</button></td>
      </tr>`;
    }).join("");
  }
  m.innerHTML = `
    <h1 class="page-title">Hasil Kunjungan Lapangan</h1>
    <p class="page-sub">Peserta yang tampil adalah yang telah diputuskan lanjut pada rapat pleno seleksi administrasi.</p>
    <div class="card">
      <h3>Instrumen Penilaian</h3>
      <p style="font-size:13px">${esc(DB.instruments.kunjungan)||'Belum ada instrumen diunggah admin.'}</p>
    </div>
    <div class="card">
      ${panelisKategoriPicker()}
      ${!UI.panelisKategori ? `<div class="empty">Pilih kategori penilaian di atas.</div>` :
        (rows ? `<table><thead><tr><th>NIP</th><th>Nama</th><th>Unit Kerja</th><th>Perangkat Daerah</th><th>Penilaian</th><th>Hasil Akhir</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty">Belum ada peserta yang lolos ke tahap ini pada kategori ini.</div>`)}
    </div>
  `;
}
function renderPanelisWawancara(){
  const m=document.getElementById('main');
  const myNip = SESSION.data.nip;
  let rows="";
  if(UI.panelisKategori){
    const list = regsByKategori(UI.panelisKategori, r=>r.plenoKunjungan && r.plenoKunjungan.keputusan==='lanjut');
    rows = list.map(r=>{
      const p=getParticipant(r.nip);
      const s = r.penilaianWawancara[myNip] || {kebaruan:'',efektivitas:'',bermanfaatan:'',replikatif:'',berkelanjutan:''};
      return `<tr>
        <td>${esc(p?p.nama:r.nip)}</td>
        ${["kebaruan","efektivitas","bermanfaatan","replikatif","berkelanjutan"].map(f=>`<td><input type="number" min="0" max="100" style="width:64px" id="ww-${r.id}-${f}" value="${s[f]}"></td>`).join("")}
        <td id="ww-${r.id}-jumlah"><b>${r.penilaianWawancara[myNip]?r.penilaianWawancara[myNip].final:'-'}</b></td>
        <td><button class="btn btn-primary btn-sm" onclick="submitWawancara('${r.id}')">Input</button></td>
      </tr>`;
    }).join("");
  }
  m.innerHTML = `
    <h1 class="page-title">Wawancara</h1>
    <p class="page-sub">Peserta yang tampil adalah yang telah diputuskan lanjut pada rapat pleno kunjungan lapangan.</p>
    <div class="card">
      ${panelisKategoriPicker()}
      ${!UI.panelisKategori ? `<div class="empty">Pilih kategori penilaian di atas.</div>` :
        (rows ? `<table><thead><tr><th>Nama</th><th>Kebaruan</th><th>Efektivitas</th><th>Bermanfaatan</th><th>Replikatif</th><th>Berkelanjutan</th><th>Jumlah</th><th></th></tr></thead><tbody>${rows}</tbody></table>`
        : `<div class="empty">Belum ada peserta yang lolos ke tahap ini pada kategori ini.</div>`)}
    </div>
  `;
}
function submitWawancara(regId){
  const r = DB.registrations.find(x=>x.id===regId);
  const fields=["kebaruan","efektivitas","bermanfaatan","replikatif","berkelanjutan"];
  const raw={};
  fields.forEach(f=>raw[f]=num(val(`ww-${regId}-${f}`)));
  raw.final = finalWawancara(raw);
  r.penilaianWawancara[SESSION.data.nip] = raw;
  saveDB(); toast("Nilai wawancara tersimpan."); renderApp();
}

function openScoreModal(regId, tahap){
  const r = DB.registrations.find(x=>x.id===regId);
  const p = getParticipant(r.nip);
  const myNip = SESSION.data.nip;
  const store = tahap==='administrasi' ? r.penilaianAdministrasi : r.penilaianKunjungan;
  const existing = store[myNip];
  const fields = tahap==='administrasi'
    ? ["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif"]
    : ["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif","durasi"];
  const kompeten = kompetenScore(p, r.sertifikatAda, r.suratTugasAda);
  document.getElementById('modal-body').innerHTML = `
    <div class="modal-head"><h3>Beri Penilaian — ${TAHAP_LABEL[tahap]}</h3><span class="modal-close" onclick="closeModal()">&times;</span></div>
    ${inovasiInfoBlock(r,p)}
    <div class="score-grid">
      ${fields.map(f=>`<div><label>${labelFor(f)} <span class="hint" style="display:inline">(bobot ${weightLabel(tahap,f)})</span></label>
        <input type="number" min="0" max="100" id="sc-${f}" value="${existing?existing[f]:''}"></div>`).join("")}
    </div>
    <div class="info-block" style="margin-top:14px">
      <b>Kompeten (otomatis)</b> — SKP: ${p?p.skp:'-'}, Sertifikat: ${r.sertifikatAda?'Ada (100)':'Tidak Ada (80)'}, Surat Tugas: ${r.suratTugasAda?'Ada (100)':'Tidak Ada (80)'}<br>
      Kontribusi ke nilai akhir: <b>${r1(kompeten)}</b>
    </div>
    <div style="margin-top:20px;display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-outline" onclick="closeModal()">Batal</button>
      <button class="btn btn-primary" onclick="saveScore('${regId}','${tahap}')">Simpan Penilaian</button>
    </div>
  `;
  showModal();
}
function weightLabel(tahap,f){
  if(tahap==='administrasi'){
    return f==='adaptif'?'40%':'10%';
  }
  if(f==='adaptif') return '30%';
  return '10%';
}
function saveScore(regId, tahap){
  const r = DB.registrations.find(x=>x.id===regId);
  const p = getParticipant(r.nip);
  const myNip = SESSION.data.nip;
  const fields = tahap==='administrasi'
    ? ["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif"]
    : ["berorientasi","akuntabel","harmonis","loyal","adaptif","kolaboratif","durasi"];
  const s={};
  fields.forEach(f=>s[f]=num(val('sc-'+f)));
  s.final = tahap==='administrasi' ? finalAdministrasi(s,p,r) : finalKunjungan(s,p,r);
  if(tahap==='administrasi') r.penilaianAdministrasi[myNip]=s;
  else r.penilaianKunjungan[myNip]=s;
  saveDB(); closeModal(); toast("Penilaian tersimpan."); renderApp();
}
</script>
